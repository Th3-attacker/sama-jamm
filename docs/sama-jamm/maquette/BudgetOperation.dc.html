<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier une opération</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="BudgetHistorique.dc.html" aria-label="Retour à l'historique" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin-left: -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">L'opération</h1>
    </div>
    <x-import component-from-global-scope="SamaJamm.AmountDisplay" montant="{{m}}" signe="-" libelle="Dépense" detail="Mardi 27 octobre · 18 h 40" centre="{{oui}}"></x-import>
    <x-import component-from-global-scope="SamaJamm.TextField" label="Montant" default-value="4 500" input-mode="numeric" suffixe="MRU"></x-import>
    <x-import component-from-global-scope="SamaJamm.TextField" label="Note" default-value="Poisson et légumes, marché Tilène" aide="Facultatif, visible seulement par vous."></x-import>
    <div role="group" aria-label="Enveloppe" style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 600;">Enveloppe</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <x-import component-from-global-scope="SamaJamm.Chip" selectionne="{{oui}}">Dépense quotidienne</x-import>
        <x-import component-from-global-scope="SamaJamm.Chip">Famille et entraide</x-import>
        <x-import component-from-global-scope="SamaJamm.Chip">Transport</x-import>
        <x-import component-from-global-scope="SamaJamm.Chip">Santé</x-import>
      </div>
    </div>
    <x-import component-from-global-scope="SamaJamm.SegmentedControl" label="Payé avec" valeur="especes" options="{{comptes}}"></x-import>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.Button" variant="principal" pleine-largeur="{{oui}}">Enregistrer</x-import><a href="BudgetHistorique.dc.html" aria-label="Enregistrer" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
      <x-import component-from-global-scope="SamaJamm.Button" variant="danger" icone="trash" pleine-largeur="{{oui}}" on-click="{{ouvrir}}">Supprimer l'opération</x-import>
    </div>
  </div>
  <x-import component-from-global-scope="SamaJamm.Dialog" ouvert="{{dialogue}}" titre="Supprimer cette dépense ?" icone="trash" danger="{{oui}}" confirmer="Supprimer" annuler="Garder" on-annuler="{{fermer}}" on-confirmer="{{fermer}}">4 500 MRU retournent dans l'enveloppe « Dépense quotidienne ».</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dialogue: false }; }
  renderVals() {
    return {
      oui: true,
      m: 4500,
      comptes: [{ id: 'especes', label: 'Espèces' }, { id: 'mobile', label: 'Mobile money' }, { id: 'banque', label: 'Banque' }],
      dialogue: this.state.dialogue,
      ouvrir: () => this.setState({ dialogue: true }),
      fermer: () => this.setState({ dialogue: false })
    };
  }
}
</script>
</body>
</html>
