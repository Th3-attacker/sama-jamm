<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Budget, premier usage</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">Votre budget, en paix</h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--encre-2);">Un budget en enveloppes, sur le cycle de votre paie. Tout reste sur ce téléphone.</p>
    </div>
    <x-import component-from-global-scope="SamaJamm.SegmentedControl" label="Votre devise" valeur="{{devise}}" on-change="{{choisirDevise}}" options="{{devises}}"></x-import>
    <x-import component-from-global-scope="SamaJamm.TextField" label="Votre jour de paie" default-value="25" input-mode="numeric" aide="Le jour du mois où vous recevez votre revenu principal."></x-import>
    <section aria-label="Vos enveloppes" style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600;">Vos enveloppes</h2>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--encre-3);">Gardez celles qui vous servent ; vous pourrez en ajouter.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{enveloppes}}" as="e" hint-placeholder-count="9">
          <x-import component-from-global-scope="SamaJamm.Chip" selectionne="{{e.on}}" on-click="{{e.basculer}}">{{e.nom}}</x-import>
        </sc-for>
      </div>
    </section>
    <div style="margin-top: auto; padding-bottom: 24px; display: flex; flex-direction: column; gap: 8px;">
      <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.Button" variant="principal" pleine-largeur="{{oui}}">Créer mon budget</x-import><a href="Budget.dc.html" aria-label="Créer mon budget" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
      <p style="margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: var(--encre-3);">{{resume}}</p>
    </div>
  </div>
  <dc-import name="TabBar" actif="budget" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { devise: 'XOF', off: { ceremonies: true, scolarite: true } }; }
  renderVals() {
    const E = [['quotidien', 'Dépense quotidienne'], ['loyer', 'Loyer'], ['energie', 'Électricité et eau'], ['transport', 'Transport'], ['scolarite', 'Scolarité'], ['sante', 'Santé'], ['famille', 'Famille et entraide'], ['ceremonies', 'Cérémonies'], ['sadaqa', 'Sadaqa']];
    const off = this.state.off;
    const n = E.filter((e) => !off[e[0]]).length;
    return {
      oui: true,
      devise: this.state.devise,
      devises: [{ id: 'XOF', label: 'F CFA' }, { id: 'MRU', label: 'Ouguiya' }, { id: 'autre', label: 'Autre' }],
      choisirDevise: (id) => this.setState({ devise: id }),
      enveloppes: E.map((e) => ({ nom: e[1], on: !off[e[0]], basculer: () => this.setState({ off: Object.assign({}, off, { [e[0]]: !off[e[0]] }) }) })),
      resume: n + ' enveloppes · vous saisirez votre revenu au prochain jour de paie.'
    };
  }
}
</script>
</body>
</html>
