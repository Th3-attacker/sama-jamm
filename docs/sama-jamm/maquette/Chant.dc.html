<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lire · chant</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex: none; padding: 52px 12px 8px; display: flex; align-items: center; gap: 8px;">
    <a href="Xassaides.dc.html" aria-label="Retour aux xassaïdes" style="width: 44px; height: 44px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--encre);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="flex-grow: 1; min-width: 0; text-align: center; display: flex; flex-direction: column;"><span style="font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 26px; color: var(--emeraude);">Matlabul Fawzayni</span><span style="font-size: 12px; line-height: 16px; color: var(--encre-3);">Cheikh Ahmadou Bamba · [nombre] vers</span></div>
    <a href="Favoris.dc.html" aria-label="Ajouter aux favoris" style="width: 44px; height: 44px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--encre);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15l-5-3.5-5 3.5z"></path></svg></a>
  </div>
  <div role="radiogroup" aria-label="Affichage" style="flex: none; margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 999px; background: var(--surface-creux);">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height: 34px; border: 0; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; background: {{m.bg}}; color: {{m.fg}};">{{m.label}}</button></sc-for>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding-top: 6px; display: flex; flex-direction: column;">
    <sc-for list="{{vers}}" as="v" hint-placeholder-count="3">
      <article aria-current="{{v.courant}}" style="margin: {{v.marge}}; padding: {{v.pad}}; border-radius: 20px; background: {{v.fond}}; border: {{v.bord}}; box-shadow: {{v.ombre}}; opacity: {{v.op}}; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--or-texte);"><span style="position: relative; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 36 36" aria-hidden="true" style="position: absolute; left: 0; top: 0;"><polygon points="18,2 22.68,6.69 29.31,6.69 29.31,13.32 34,18 29.31,22.68 29.31,29.31 22.68,29.31 18,34 13.32,29.31 6.69,29.31 6.69,22.68 2,18 6.69,13.32 6.69,6.69 13.32,6.69" fill="var(--or-doux)" stroke="var(--or)" stroke-width="1.3"></polygon></svg><span style="position: relative; font-size: 12px; color: var(--or-texte);">{{v.n}}</span></span>Vers {{v.n}}<span style="margin-left: auto; color: var(--emeraude);">{{v.etat}}</span></div>
        <sc-if value="{{v.ar}}" hint-placeholder-val="{{ true }}"><div lang="ar" dir="rtl" style="display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-arabe); font-size: 20px; line-height: 38px;"><span>[premier hémistiche]</span><span>[second hémistiche]</span></div></sc-if>
        <sc-if value="{{v.fr}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-family: var(--font-lecture); font-size: 15px; line-height: 22px; color: var(--encre-2);">[Traduction validée du vers]</p></sc-if>
      </article>
    </sc-for>
  </div>
  <a href="LecteurAudio.dc.html" aria-label="Chant en cours : ouvrir le lecteur" style="flex: none; position: relative; margin: 0 12px 8px; padding: 10px; border-radius: 16px; background: var(--emeraude-aplat); color: var(--sur-emeraude); display: flex; align-items: center; gap: 12px; text-decoration: none; overflow: hidden;">
    <span aria-hidden="true" style="position: absolute; top: 4px; left: 50%; width: 28px; height: 3px; margin-left: -14px; border-radius: 3px; background: var(--sur-emeraude-2); opacity: 0.5;"></span>
    <span lang="ar" style="width: 44px; height: 44px; border-radius: 10px; flex: none; background: var(--or-doux); color: var(--or-texte); display: flex; align-items: center; justify-content: center; font-family: var(--font-arabe); font-size: 14px;">مطلب</span>
    <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;"><span style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Matlabul Fawzayni · vers 2</span><span style="font-size: 12px; line-height: 16px; color: var(--sur-emeraude-2);">[Kurel] · le vers chanté s'illumine</span></span>
    <span style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5h3v13H8zM13 5.5h3v13h-3z" fill="currentColor"></path></svg></span>
    <span aria-hidden="true" style="position: absolute; left: 10px; right: 10px; bottom: 4px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.22);"><span style="display: block; width: 34%; height: 2px; border-radius: 2px; background: var(--or-sur-emeraude);"></span></span>
  </a>
  <dc-import name="TabBar" actif="lire" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'ar-fr' }; }
  renderVals() {
    const s = this.state;
    const seg = (on) => ({ on: on ? 'true' : 'false', bg: on ? 'var(--surface)' : 'transparent', fg: on ? 'var(--emeraude)' : 'var(--encre-2)' });
    return {
      modes: [['ar', 'Arabe'], ['ar-fr', 'Arabe + trad.'], ['fr', 'Traduction']].map((m) => Object.assign({ label: m[1], pick: () => this.setState({ mode: m[0] }) }, seg(s.mode === m[0]))),
      montrerAr: s.mode !== 'fr',
      montrerFr: s.mode !== 'ar',
      vers: [1, 2, 3].map((n) => {
        const c = n === 2;
        return {
          n: n, courant: c ? 'true' : 'false', etat: c ? '● En cours' : '', ar: s.mode !== 'fr', fr: s.mode !== 'ar',
          marge: c ? '6px 12px' : '0 12px', pad: c ? '18px 16px' : '12px 12px',
          fond: c ? 'var(--surface)' : 'transparent', bord: c ? '1px solid var(--ligne)' : '0',
          ombre: c ? 'var(--ombre-1)' : 'none', op: c ? '1' : '0.45'
        };
      })
    };
  }
}
</script>
</body>
</html>
