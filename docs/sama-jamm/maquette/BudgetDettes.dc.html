<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dettes entre proches</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="Budget.dc.html" aria-label="Retour au budget" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin-left: -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">Dettes</h1>
    </div>
    <p style="margin: -8px 0 0; font-family: var(--font-lecture); font-style: italic; font-size: 16px; line-height: 24px; color: var(--encre-2);">Entre proches, sans intérêt.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <section aria-label="On me doit" style="padding: 16px; border-radius: var(--rayon-carte); background: var(--surface); border: 1px solid var(--ligne); display: flex; flex-direction: column; gap: 4px;">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--encre-2);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg>On me doit</span>
        <span style="font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;">85 000 MRU</span>
      </section>
      <section aria-label="Je dois" style="padding: 16px; border-radius: var(--rayon-carte); background: var(--surface); border: 1px solid var(--ligne); display: flex; flex-direction: column; gap: 4px;">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--encre-2);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg>Je dois</span>
        <span style="font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;">30 000 MRU</span>
      </section>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--encre-2);">Solde : <b style="color: var(--encre);">+ 55 000 MRU</b> en votre faveur.</p>
    <x-import component-from-global-scope="SamaJamm.SegmentedControl" label="Sens" valeur="{{sens}}" on-change="{{choisir}}" options="{{sensOptions}}"></x-import>
    <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.ListGroup">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="arrow-up" titre="Ibrahima" sous-titre="Échéance passée depuis 12 jours" valeur="Reste 25 000 MRU" fin="chevron"></x-import>
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="arrow-up" titre="Awa" sous-titre="Prêté le 3 novembre · échéance le 30 novembre" valeur="Reste 60 000 MRU" fin="chevron"></x-import>
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="arrow-down" titre="Oncle Mamadou" sous-titre="Emprunté le 20 octobre · sans échéance" valeur="Reste 30 000 MRU" fin="chevron"></x-import>
    </x-import><a href="BudgetDette.dc.html" aria-label="Ouvrir une dette" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
    <x-import component-from-global-scope="SamaJamm.ListGroup">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="check" titre="Dettes soldées" valeur="3" fin="chevron"></x-import>
    </x-import>
    <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.Button" variant="principal" icone="plus" pleine-largeur="{{oui}}">Ajouter une dette</x-import><a href="BudgetDetteNouvelle.dc.html" aria-label="Ajouter une dette" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
  </div>
  <dc-import name="TabBar" actif="budget" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      oui: true,
      sens: 'tous',
      sensOptions: [{ id: 'tous', label: 'Toutes' }, { id: 'prete', label: 'On me doit' }, { id: 'emprunte', label: 'Je dois' }],
      choisir: () => {}
    };
  }
}
</script>
</body>
</html>
