<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages · lecture</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <a href="Lecteur.dc.html" aria-label="Fermer les réglages" style="flex-grow: 1; min-height: 0; position: relative; display: block; text-decoration: none; color: var(--encre);">
    <div style="padding: 52px 24px 0; display: flex; flex-direction: column; gap: 10px;"><span style="align-self: center; font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--emeraude);">Al-Kahf</span><p lang="ar" dir="rtl" style="margin: 0; font-family: var(--font-coran); font-size: 26px; line-height: 52px; text-align: right;">إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ</p></div>
    <span style="position: absolute; inset: 0; background: var(--voile);"></span>
  </a>
  <section aria-label="Réglages de lecture" style="flex: none; margin-top: -24px; position: relative; padding: 10px 20px 28px; border-radius: 24px 24px 0 0; background: var(--surface); box-shadow: var(--ombre-2); display: flex; flex-direction: column; gap: 14px;">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 4px; background: var(--ligne-forte); opacity: 0.6;"></span>
    <div style="display: flex; align-items: center; justify-content: space-between;"><h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 30px; color: var(--emeraude);">Lecture</h1><a href="Lecteur.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--encre-2);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a></div>
    <div aria-label="Aperçu" style="padding: 14px 16px; border-radius: 16px; background: var(--fond); display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--or-texte);">Aperçu · 94:6</span>
      <p lang="ar" dir="rtl" style="margin: 0; font-family: var(--font-coran); font-size: {{taillePx}}; line-height: 2; text-align: right;">إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا {{numero}}</p>
      <sc-if value="{{translit}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-family: var(--font-lecture); font-style: italic; font-size: 14px; line-height: 20px; color: var(--encre-3);">Inna maʿa l-ʿusri yusrā</p></sc-if>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 14px; line-height: 20px; font-weight: 600;">Taille de l'arabe</span>
      <div role="radiogroup" aria-label="Taille de l'arabe" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: var(--surface-creux);">
        <sc-for list="{{tailles}}" as="t" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; cursor: pointer; font-family: var(--font-arabe); font-size: {{t.fs}}; background: {{t.bg}}; color: {{t.fg}};">أ</button></sc-for>
      </div></div>
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--ligne);"><span id="rl1" style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; line-height: 22px; font-weight: 600;">Translittération</span><span style="font-size: 12px; line-height: 16px; color: var(--encre-3);">Sous le texte arabe, en lettres latines</span></span><button type="button" role="switch" aria-checked="{{sw1.on}}" aria-labelledby="rl1" onClick="{{basculerTranslit}}" style="width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 999px; cursor: pointer; display: flex; justify-content: {{sw1.pos}}; background: {{sw1.bg}};"><span style="width: 24px; height: 24px; border-radius: 999px; background: var(--fond);"></span></button></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--ligne);"><span id="rl2" style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; line-height: 22px; font-weight: 600;">Chiffres arabes</span><span style="font-size: 12px; line-height: 16px; color: var(--encre-3);">Numéros ١٢٣ au lieu de 123</span></span><button type="button" role="switch" aria-checked="{{sw2.on}}" aria-labelledby="rl2" onClick="{{basculerChiffres}}" style="width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 999px; cursor: pointer; display: flex; justify-content: {{sw2.pos}}; background: {{sw2.bg}};"><span style="width: 24px; height: 24px; border-radius: 999px; background: var(--fond);"></span></button></div>
      <a href="Recitateur.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; text-decoration: none; color: var(--encre);"><span style="flex-grow: 1; font-size: 16px; line-height: 22px; font-weight: 600;">Récitateur par défaut</span><span style="font-size: 14px; color: var(--encre-3);">Mishary Al-Afasy</span><span style="color: var(--encre-3); display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg></span></a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { taille: 2, translit: false, chiffres: true }; }
  renderVals() {
    const s = this.state;
    const seg = (on) => ({ on: on ? 'true' : 'false', bg: on ? 'var(--surface)' : 'transparent', fg: on ? 'var(--emeraude)' : 'var(--encre-2)' });
    const sw = (on) => ({ on: on ? 'true' : 'false', pos: on ? 'flex-end' : 'flex-start', bg: on ? 'var(--emeraude-aplat)' : 'var(--ligne-forte)' });
    return {
      taillePx: ['22px', '28px', '36px'][s.taille - 1],
      tailles: [1, 2, 3].map((n) => Object.assign({ fs: ['16px', '22px', '28px'][n - 1], pick: () => this.setState({ taille: n }) }, seg(s.taille === n))),
      translit: s.translit,
      sw1: sw(s.translit), sw2: sw(s.chiffres),
      basculerTranslit: () => this.setState({ translit: !s.translit }),
      basculerChiffres: () => this.setState({ chiffres: !s.chiffres }),
      numero: s.chiffres ? '﴿٦﴾' : '﴿6﴾'
    };
  }
}
</script>
</body>
</html>
