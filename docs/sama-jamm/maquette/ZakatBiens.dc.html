<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Zakat, mes biens</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="BudgetZakat.dc.html" aria-label="Retour à la zakat" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin-left: -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">Mes biens</h1>
    </div>
    <x-import component-from-global-scope="SamaJamm.SegmentedControl" label="Seuil (nisab) calculé sur" valeur="{{base}}" on-change="{{choisirBase}}" options="{{bases}}"></x-import>
    <p style="margin: -4px 0 0; font-size: 14px; line-height: 20px; color: var(--encre-3);">{{explication}}</p>
    <x-import component-from-global-scope="SamaJamm.ListGroup" titre="Ce que vous possédez">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="heart" ton="or" titre="Or et bijoux" sous-titre="48 g · prix du gramme saisi par vous" valeur="1 200 000" fin="chevron"></x-import>
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="wallet" titre="Épargne et comptes" sous-titre="Repris de vos comptes" valeur="850 000" fin="chevron"></x-import>
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="users" titre="Créances" sous-titre="Argent prêté, qui vous sera rendu" valeur="150 000" fin="chevron"></x-import>
    </x-import>
    <x-import component-from-global-scope="SamaJamm.ListGroup" titre="À déduire">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="minus" ton="neutre" titre="Dettes à rembourser" sous-titre="Échéances de l'année" valeur="− 300 000" fin="chevron"></x-import>
    </x-import>
    <x-import component-from-global-scope="SamaJamm.Button" variant="discret" icone="plus">Ajouter un bien</x-import>
    <div style="margin-top: auto; padding: 16px 16px; border-radius: 16px; background: var(--emeraude-doux); color: var(--sur-emeraude-doux); display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 14px; line-height: 20px;">Patrimoine net : 1 900 000 MRU · au-dessus du seuil</span>
      <span style="font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums;">Zakat : 47 500 MRU</span>
      <span style="font-size: 12px; line-height: 16px;">Estimation à 2,5 %. Pour un cas particulier, demandez à une personne de science.</span>
    </div>
    <div style="height: 8px;"></div>
  </div>
  <dc-import name="TabBar" actif="budget" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { base: 'argent' }; }
  renderVals() {
    const t = {
      argent: "595 g d'argent. Seuil plus bas : plus de foyers doivent la zakat.",
      or: "85 g d'or. Seuil plus haut, retenu par certaines écoles."
    };
    return {
      base: this.state.base,
      bases: [{ id: 'argent', label: 'Argent' }, { id: 'or', label: 'Or' }],
      choisirBase: (id) => this.setState({ base: id }),
      explication: t[this.state.base] + " Le bien doit être détenu une année lunaire."
    };
  }
}
</script>
</body>
</html>
