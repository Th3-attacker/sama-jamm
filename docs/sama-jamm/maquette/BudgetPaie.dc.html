<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Jour de paie</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <a href="Budget.dc.html" aria-label="Retour au budget" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin-left: -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
        <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">Jour de paie</h1>
      </div>
      <p style="margin: 0; font-family: var(--font-lecture); font-style: italic; font-size: 16px; line-height: 24px; color: var(--encre-2);">Mettre de côté d'abord, puis répartir.</p>
    </div>
    <x-import component-from-global-scope="SamaJamm.AmountDisplay" libelle="Revenu reçu le 25 octobre" montant="{{m.recu}}" signe="+" ton="revenu"></x-import>
    <x-import component-from-global-scope="SamaJamm.ListGroup" titre="D'abord, mettre de côté">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="heart" ton="or" titre="Tabaski" sous-titre="Objectif d'épargne" valeur="20 000 MRU" fin="chevron"></x-import>
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="target" ton="or" titre="Urgence" sous-titre="Objectif d'épargne" valeur="20 000 MRU" fin="chevron"></x-import>
    </x-import>
    <x-import component-from-global-scope="SamaJamm.ListGroup" titre="Puis répartir · repris du mois dernier">
      <sc-for list="{{enveloppes}}" as="e" hint-placeholder-count="6">
        <x-import component-from-global-scope="SamaJamm.ListItem" icone="{{e.icone}}" ton="neutre" titre="{{e.nom}}" valeur="{{e.montant}}" fin="chevron"></x-import>
      </sc-for>
    </x-import>
  </div>
  <div style="flex: none; padding: 12px 20px 32px; background: var(--surface); border-top: 1px solid var(--ligne); display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 14px; line-height: 20px; color: var(--encre-2);">Pas encore réparti</span>
      <span style="font-size: 18px; line-height: 24px; font-weight: 600; color: var(--alerte); font-variant-numeric: tabular-nums;">43 000 MRU</span>
    </div>
    <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.Button" variant="principal" pleine-largeur="{{oui}}">Valider la répartition</x-import><a href="Budget.dc.html" aria-label="Valider la répartition" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      oui: true,
      m: { recu: 350000 },
      enveloppes: [
        { nom: 'Dépense quotidienne', icone: 'cart', montant: '120 000 MRU' },
        { nom: 'Loyer', icone: 'home', montant: '75 000 MRU' },
        { nom: 'Électricité et eau', icone: 'bolt', montant: '25 000 MRU' },
        { nom: 'Transport', icone: 'car', montant: '20 000 MRU' },
        { nom: 'Famille et entraide', icone: 'users', montant: '20 000 MRU' },
        { nom: 'Sadaqa', icone: 'heart', montant: '7 000 MRU' }
      ]
    };
  }
}
</script>
</body>
</html>
