<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvelle dette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="BudgetDettes.dc.html" aria-label="Retour aux dettes" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin-left: -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">Ajouter une dette</h1>
    </div>
    <x-import component-from-global-scope="SamaJamm.SegmentedControl" label="Sens" valeur="{{sens}}" on-change="{{choisir}}" options="{{sensOptions}}"></x-import>
    <x-import component-from-global-scope="SamaJamm.TextField" label="Personne" placeholder="Prénom ou nom" default-value="Ibrahima"></x-import>
    <x-import component-from-global-scope="SamaJamm.TextField" label="Montant" default-value="40 000" suffixe="MRU" input-mode="numeric"></x-import>
    <x-import component-from-global-scope="SamaJamm.TextField" label="Échéance (facultatif)" placeholder="jj/mm/aaaa" default-value="30/11/2026" input-mode="numeric"></x-import>
    <x-import component-from-global-scope="SamaJamm.TextField" label="Note (facultatif)" placeholder="Ce dont vous êtes convenus" default-value="Pour les frais de scolarité"></x-import>
    <x-import component-from-global-scope="SamaJamm.Banner" ton="info" icone="info">Aucun intérêt n'est calculé. Le nom reste sur ce téléphone, chiffré.</x-import>
    <div style="margin-top: auto; padding-bottom: 16px;">
      <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.Button" variant="principal" pleine-largeur="{{oui}}">Enregistrer</x-import><a href="BudgetDettes.dc.html" aria-label="Enregistrer" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
    </div>
  </div>
  <dc-import name="TabBar" actif="budget" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sens: 'prete' }; }
  renderVals() {
    return {
      oui: true,
      sens: this.state.sens,
      sensOptions: [{ id: 'prete', label: "J'ai prêté" }, { id: 'emprunte', label: "J'ai emprunté" }],
      choisir: (id) => this.setState({ sens: id })
    };
  }
}
</script>
</body>
</html>
