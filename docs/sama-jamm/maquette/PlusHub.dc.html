<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plus, tout Sama Jàmm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between;">
      <div>
        <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 44px; color: var(--emeraude);">Plus</h1>
        <p style="margin: 0; font-family: var(--font-lecture); font-style: italic; font-size: 16px; line-height: 24px; color: var(--encre-2);">Tout Sama Jàmm, au même endroit.</p>
      </div>
      <a href="Recherche.dc.html" aria-label="Rechercher" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--encre-2);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{tuiles}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="position: relative; display: flex; flex-direction: column; gap: 4px; min-height: 108px; padding: 16px; box-sizing: border-box; border-radius: 16px; background: {{t.bg}}; border: 1px solid var(--ligne); text-decoration: none; color: var(--encre);">
          <span style="width: 40px; height: 40px; border-radius: 14px; margin-bottom: 8px; background: {{t.pastille}}; color: {{t.encre}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
          <span style="font-size: 16px; line-height: 24px; font-weight: 600;">{{t.titre}}</span>
          <span style="font-size: 14px; line-height: 20px; color: var(--encre-2);">{{t.texte}}</span>
          <span style="position: absolute; top: 12px; right: 12px; padding: 4px 8px; border-radius: 6px; background: var(--or-doux); color: var(--or-texte); font-size: 12px; line-height: 16px; font-weight: 600; display: {{t.badge}};">1 en cours</span>
        </a>
      </sc-for>
    </div>
    <div role="list" style="display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--ligne); border-radius: 16px; overflow: hidden;">
      <sc-for list="{{lignes}}" as="l" hint-placeholder-count="6">
        <a role="listitem" href="{{l.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: {{l.trait}}; text-decoration: none; color: var(--encre);">
          <span style="width: 32px; height: 32px; border-radius: 999px; background: var(--surface-creux); color: var(--encre-2); display: flex; align-items: center; justify-content: center; flex: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.d}}"></path></svg></span>
          <span style="flex-grow: 1; font-size: 16px; line-height: 24px;">{{l.titre}}</span>
          <span style="font-size: 14px; color: var(--encre-3);">{{l.valeur}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--encre-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Navigation principale" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 8px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--ligne);">
    <sc-for list="{{onglets}}" as="o" hint-placeholder-count="5">
      <a href="{{o.href}}" aria-current="{{o.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{o.color}};">
        <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{o.pill}};"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.d}}"></path></svg></span>
        <span style="font-size: 12px; line-height: 16px; font-weight: {{o.weight}};">{{o.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
