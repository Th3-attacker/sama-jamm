<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bilan du cycle</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <a href="Budget.dc.html" aria-label="Retour au budget" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin-left: -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
        <h1 style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">Bilan du cycle</h1>
      </div>
      <p style="margin: 0; font-family: var(--font-lecture); font-style: italic; font-size: 16px; line-height: 24px; color: var(--encre-2);">Du 25 octobre au 24 novembre. Que faire de ce qui reste ?</p>
    </div>
    <x-import component-from-global-scope="SamaJamm.AmountDisplay" libelle="Reste dans vos enveloppes" montant="{{total}}" ton="revenu"></x-import>
    <sc-for list="{{lignes}}" as="l" hint-placeholder-count="3">
      <div style="padding: 16px 16px; background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <span style="font-size: 16px; line-height: 24px;">{{l.nom}}</span>
          <span style="font-size: 16px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums;">{{l.reste}}</span>
        </div>
        <x-import component-from-global-scope="SamaJamm.SegmentedControl" label="{{l.label}}" valeur="{{l.choix}}" on-change="{{l.choisir}}" options="{{choix}}"></x-import>
      </div>
    </sc-for>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--encre-2);">{{resume}}</p>
    <div style="margin-top: auto; padding-bottom: 16px;">
      <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.Button" variant="principal" pleine-largeur="{{oui}}">Clore le cycle</x-import><a href="BudgetPaie.dc.html" aria-label="Clore le cycle" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { a: 'reporter', b: 'epargner', c: 'sadaqa' }; }
  renderVals() {
    const f = (n) => n.toLocaleString('fr-FR').replace(/ | /g, ' ') + ' F';
    const E = [['a', 'Dépense quotidienne', 18000], ['b', 'Électricité et eau', 4500], ['c', 'Famille et entraide', 9000]];
    const somme = { reporter: 0, epargner: 0, sadaqa: 0 };
    E.forEach((e) => { somme[this.state[e[0]]] += e[2]; });
    return {
      total: 31500,
      choix: [{ id: 'reporter', label: 'Reporter' }, { id: 'epargner', label: 'Épargner' }, { id: 'sadaqa', label: 'Sadaqa' }],
      lignes: E.map((e) => ({
        nom: e[1], reste: f(e[2]), choix: this.state[e[0]], label: 'Que faire du reste de ' + e[1],
        choisir: (id) => this.setState({ [e[0]]: id })
      })),
      resume: 'Reporté au cycle suivant : ' + f(somme.reporter) + ' · vers l’épargne : ' + f(somme.epargner) + ' · en sadaqa : ' + f(somme.sadaqa) + '.',
      oui: true
    };
  }
}
</script>
</body>
</html>
