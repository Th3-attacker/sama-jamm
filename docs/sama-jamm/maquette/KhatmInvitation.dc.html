<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Invitation au khatm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Source+Sans+3:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre); font-family: var(--font-ui);">
  <div style="flex-grow: 1; padding: 56px 20px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <a href="Accueil.dc.html" aria-label="Retour à l'accueil" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin: 0 0 -8px -12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 lang="wo" style="margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 36px; color: var(--emeraude);">Benn loxo du tàccu.</h1>
      <p style="margin: 0; font-family: var(--font-lecture); font-style: italic; font-size: 16px; line-height: 24px; color: var(--encre-2);">Une seule main ne peut pas applaudir.</p>
    </div>
    <div style="padding: 16px 16px; background: var(--or-doux); border-radius: 12px; display: flex; flex-direction: column; gap: 4px;">
      <p style="margin: 0; font-size: 16px; line-height: 24px;"><b style="font-weight: 600;">Awa</b> vous invite au khatm « Pour la famille ».</p>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--encre-2);">{{resume}} · à terminer avant le [date]</p>
    </div>
    <x-import component-from-global-scope="SamaJamm.KhatmGrid" juz="{{juz}}" on-choisir="{{choisir}}"></x-import>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <div style="position: relative;"><x-import component-from-global-scope="SamaJamm.Button" variant="principal" pleine-largeur="{{oui}}" disabled="{{attente}}">{{bouton}}</x-import><a href="Khatm.dc.html" aria-label="Prendre ce juz" style="position: absolute; inset: 0; border-radius: 12px;"></a></div>
      <p style="margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: var(--encre-3);">Vous pourrez le rendre si vous ne pouvez pas le terminer.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { choix: null }; }
  renderVals() {
    const choix = this.state.choix;
    const juz = [];
    for (let n = 1; n <= 30; n++) {
      let etat = n <= 17 ? 'lu' : n <= 22 ? 'en-cours' : 'libre';
      if (n === choix) etat = 'vous';
      juz.push({ n: n, etat: etat });
    }
    const libres = juz.filter((j) => j.etat === 'libre').length;
    return {
      juz: juz,
      choisir: (n) => this.setState({ choix: n }),
      resume: '17 juz lus · 5 en cours · ' + libres + ' libres',
      bouton: choix ? 'Prendre le juz ' + choix : 'Touchez un juz libre',
      attente: !choix,
      oui: true
    };
  }
}
</script>
</body>
</html>
