<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Réglages en arabe</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/samajamm/tokens.css">
<link rel="stylesheet" href="ds/samajamm/components/bundle.css">
<script src="ds/samajamm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Noto+Sans+Arabic:wght@400;600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--emeraude)}
</style>
</helmet>
<div class="interface-ar" dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--fond); color: var(--encre);">
  <div style="flex-grow: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="ArAccueil.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--encre); margin-inline-start: -10px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: scaleX(-1);"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-family: var(--font-display-ar); font-weight: 700; font-size: 30px; line-height: 36px; color: var(--emeraude);">الإعدادات</h1>
    </div>
    <x-import component-from-global-scope="SamaJamm.SegmentedControl" label="السمة" valeur="{{theme}}" on-change="{{choisirTheme}}" options="{{themes}}"></x-import>
    <x-import component-from-global-scope="SamaJamm.ListGroup" titre="القراءة">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="globe" titre="لغة التطبيق" valeur="العربية" fin="chevron"></x-import>
      <x-import component-from-global-scope="SamaJamm.ListItem" titre="الأرقام الهندية (٠-٩)" sous-titre="{{exemple}}">
        <x-import component-from-global-scope="SamaJamm.Switch" label="الأرقام الهندية" active="{{chiffres}}" on-change="{{basculer}}"></x-import>
      </x-import>
    </x-import>
    <x-import component-from-global-scope="SamaJamm.ListGroup" titre="الصلاة">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="clock" titre="طريقة الحساب" valeur="رابطة العالم الإسلامي" fin="chevron"></x-import>
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="bell" titre="الأذان والتذكيرات" valeur="لكل صلاة" fin="chevron"></x-import>
    </x-import>
    <x-import component-from-global-scope="SamaJamm.ListGroup" titre="الميزانية">
      <x-import component-from-global-scope="SamaJamm.ListItem" icone="wallet" titre="العملة" valeur="الأوقية · MRU" fin="chevron"></x-import>
    </x-import>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--encre-3); text-align: center;">{{version}}</p>
  </div>
  <nav aria-label="التنقل الرئيسي" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 8px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--ligne);">
    <sc-for list="{{onglets}}" as="o" hint-placeholder-count="5">
      <a href="{{o.href}}" aria-current="{{o.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{o.color}};">
        <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{o.pill}};"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.d}}"></path></svg></span>
        <span style="font-size: 14px; line-height: 20px; font-weight: {{o.weight}};">{{o.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: 'auto', chiffres: false }; }
  renderVals() {
    const ind = (s) => String(s).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const c = this.state.chiffres;
    const n = (s) => (c ? ind(s) : String(s));
    const actif = 'accueil';
    const T = [
      ['accueil', 'الرئيسية', 'ArAccueil.dc.html', 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z'],
      ['lire', 'اقرأ', 'ArBibliotheque.dc.html', 'M12 6.5c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v14'],
      ['priere', 'الصلاة', 'Priere.dc.html', 'M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17zM12 7.5V12l3 2'],
      ['budget', 'الميزانية', 'Budget.dc.html', 'M5.5 6.5h13a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM3.5 10h17'],
      ['plus', 'المزيد', 'PlusHub.dc.html', 'M6 5h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM14 5h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM6 13h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zM14 13h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z']
    ];
    return {
      theme: this.state.theme,
      themes: [{ id: 'auto', label: 'تلقائي' }, { id: 'jour', label: 'نهاري' }, { id: 'nuit', label: 'ليلي' }, { id: 'veille', label: 'هادئ' }],
      choisirTheme: (id) => this.setState({ theme: id }),
      chiffres: c,
      basculer: (v) => this.setState({ chiffres: v }),
      exemple: 'الآية ' + n(46) + ' من ' + n(110) + ' · ' + n('16:35'),
      version: 'الإصدار ' + n('1.0.0'),
      onglets: T.map((t) => {
        const on = t[0] === actif;
        return { label: t[1], href: t[2], d: t[3], color: on ? 'var(--emeraude)' : 'var(--encre-2)', pill: on ? 'var(--emeraude-doux)' : 'transparent', weight: on ? 600 : 400, current: on ? 'page' : 'false' };
      })
    };
  }
}
</script>
</body>
</html>
